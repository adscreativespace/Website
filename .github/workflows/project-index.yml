name: Update project index
# Keeps projects/index.json in sync with the .md files, so the website can list
# projects without calling the rate-limited GitHub API.
on:
  push:
    branches: [main]
    paths: ['projects/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build index
        run: |
          python3 - <<'PY'
          import os, json
          names = sorted(n for n in os.listdir('projects') if n.endswith('.md'))
          open('projects/index.json', 'w').write(json.dumps(names, indent=1) + '\n')
          PY
      - name: Commit if changed
        run: |
          if ! git diff --quiet projects/index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add projects/index.json
            git commit -m "Update project index"
            git push
          fi
